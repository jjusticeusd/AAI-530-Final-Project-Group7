[project]
name = "referee"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "groq",
    "httpx",
    "openrouter",
    "pypdf",
    "python-dotenv",
    "streamlit",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
